# Everything the website shows. To add a system, add one item to "sistemas".
# Texts have a Portuguese (pt), a Spanish (es) and an English (en) version. A link left empty is hidden.

site:
  titulo: Miguel Facchini
  github: https://github.com/facchini-miguel
  youtube: https://www.youtube.com/@404devopsnotfound
  email: miguelfacchini@gmail.com
  # Ways to support the projects. Each one appears only when filled in.
  apoio:
    pix: 8ed9040e-2c49-40e1-a7bb-b6447bbc4223  # Pix random key (never the CPF)
    # Required by the Pix QR code standard (BR Code); shown by the payer's bank app.
    pix_nome: MIGUEL FACCHINI
    pix_cidade: SAO LEOPOLDO
    github_sponsors: https://github.com/sponsors/facchini-miguel
    kofi: https://ko-fi.com/404devopsnotfound

sistemas:
  - id: kaladrius
    nome: Kaladrius
    logo: imagens/kaladrius/logo.svg
    # The newest version comes from the GitHub releases when the site is built.
    repositorio: facchini-miguel/kaladrius
    situacao:
      pt: Em desenvolvimento, em uso de demonstração
      en: In development, running as a demo
      es: En desarrollo, funcionando como demostración
    resumo:
      pt: Gestão de clínicas de saúde, de código aberto. Agenda, pacientes, prontuário, orçamentos, rechamadas e financeiro num só sistema web.
      en: Open-source management for health clinics. Schedule, patients, medical record, estimates, recalls and finance in one web app.
      es: Gestión de clínicas de salud, de código abierto. Agenda, pacientes, historia clínica, presupuestos, recordatorios y finanzas en un solo sistema web.
    descricao:
      pt:
        - O Kaladrius é um sistema web para clínicas odontológicas, médicas e de outras áreas da saúde. Funciona em qualquer navegador, no computador ou no celular, e cada clínica pode instalar no próprio servidor.
        - O nome vem do caladrius, a ave branca das lendas medievais que cura os doentes com o olhar.
        - É gratuito e de código aberto, sob a Licença Apache 2.0, e está em português, inglês e espanhol.
      en:
        - Kaladrius is a web app for dental, medical and other health clinics. It runs in any browser, on a computer or a phone, and each clinic can install it on its own server.
        - The name comes from the caladrius, the white bird of medieval legends that cures the sick by looking at them.
        - It is free and open source, under the Apache License 2.0, and available in Portuguese, English and Spanish.
      es:
        - Kaladrius es un sistema web para clínicas odontológicas, médicas y de otras áreas de la salud. Funciona en cualquier navegador, en la computadora o en el celular, y cada clínica puede instalarlo en su propio servidor.
        - El nombre viene del caladrius, el ave blanca de las leyendas medievales que cura a los enfermos con la mirada.
        - Es gratuito y de código abierto, bajo la Licencia Apache 2.0, y está en portugués, inglés y español.
    recursos:
      - pt: Agenda por profissional, com presença, faltas e horários bloqueados
        en: Schedule per practitioner, with attendance, no-shows and blocked times
        es: Agenda por profesional, con asistencia, ausencias y horarios bloqueados
      - pt: Cadastro de pacientes, aniversariantes e rechamadas de retorno
        en: Patient records, birthdays and follow-up recalls
        es: Registro de pacientes, cumpleaños y recordatorios de control
      - pt: Prontuário com anamnese, atestados, receitas, pedidos de exames e anexos
        en: Medical record with anamnesis, certificates, prescriptions, exam requests and attachments
        es: Historia clínica con anamnesis, certificados, recetas, solicitudes de exámenes y adjuntos
      - pt: Orçamentos com tabela de procedimentos e odontograma
        en: Estimates with a procedure price list and dental chart
        es: Presupuestos con tabla de procedimientos y odontograma
      - pt: Financeiro com caixa do dia, contas a receber e a pagar, comissões e extrato bancário
        en: Finance with the daily cash, receivables and payables, commissions and bank statements
        es: Finanzas con la caja del día, cuentas por cobrar y por pagar, comisiones y extracto bancario
      - pt: Perfis de acesso, auditoria e regras da LGPD
        en: Access roles, audit log and Brazilian data protection (LGPD) rules
        es: Perfiles de acceso, auditoría y reglas de la ley brasileña de protección de datos (LGPD)
    tecnologias: [Python, Django, PostgreSQL, HTMX, Bootstrap, Docker]
    links:
      demo: https://kaladrius.facchini.eti.br
      documentacao: https://kaladrius-docs.facchini.eti.br
      github: https://github.com/facchini-miguel/kaladrius
      versoes: https://github.com/facchini-miguel/kaladrius/releases
      app: ""
    telas:
      - arquivo: imagens/kaladrius/inicio.png
        legenda: {pt: Resumo do dia na tela de início, en: Summary of the day on the home page, es: Resumen del día en la pantalla de inicio}
      - arquivo: imagens/kaladrius/agenda.png
        legenda: {pt: Agenda da semana por profissional, en: Weekly schedule per practitioner, es: Agenda semanal por profesional}
      - arquivo: imagens/kaladrius/prontuario.png
        legenda: {pt: Atendimento no prontuário, en: A visit in the medical record, es: Consulta en la historia clínica}
      - arquivo: imagens/kaladrius/orcamento.png
        legenda: {pt: Orçamento com odontograma, en: Estimate with the dental chart, es: Presupuesto con odontograma}
      - arquivo: imagens/kaladrius/fluxo-de-caixa.png
        legenda: {pt: Fluxo de caixa, en: Cash flow, es: Flujo de caja}
      - arquivo: imagens/kaladrius/ficha.png
        legenda: {pt: Ficha do paciente, en: Patient record, es: Ficha del paciente}
      - arquivo: imagens/kaladrius/pacientes.png
        legenda: {pt: Lista de pacientes, en: Patient list, es: Lista de pacientes}
      - arquivo: imagens/kaladrius/rechamadas.png
        legenda: {pt: Rechamadas de retorno, en: Follow-up recalls, es: Recordatorios de control}
      - arquivo: imagens/kaladrius/aniversariantes.png
        legenda: {pt: Aniversariantes, en: Birthdays, es: Cumpleaños}
      - arquivo: imagens/kaladrius/contas-a-receber.png
        legenda: {pt: Contas a receber, en: Receivables, es: Cuentas por cobrar}
      - arquivo: imagens/kaladrius/contas-a-pagar.png
        legenda: {pt: Contas a pagar, en: Payables, es: Cuentas por pagar}
      - arquivo: imagens/kaladrius/relatorios.png
        legenda: {pt: Relatórios financeiros, en: Financial reports, es: Informes financieros}
      - arquivo: imagens/kaladrius/equipe.png
        legenda: {pt: Equipe e perfis de acesso, en: Team and access roles, es: Equipo y perfiles de acceso}
      - arquivo: imagens/kaladrius/auditoria.png
        legenda: {pt: Auditoria de quem fez o quê, en: Audit log of who did what, es: Auditoría de quién hizo qué}
      - arquivo: imagens/kaladrius/saude.png
        legenda: {pt: "Saúde do servidor: processador, memória, disco e rede", en: "Server health: processor, memory, disk and network", es: "Salud del servidor: procesador, memoria, disco y red"}
      - arquivo: imagens/kaladrius/novidades.png
        legenda: {pt: Novidades de cada versão, en: What's new in each version, es: Novedades de cada versión}
      - arquivo: imagens/kaladrius/login.png
        legenda: {pt: Tela de entrada, en: Sign-in page, es: Pantalla de acceso}
    # Public demo logins (Kaladrius decision 085): they cannot change the password nor upload files.
    acessos:
      - perfil: {pt: Recepção, en: Front desk, es: Recepción}
        usuario: demo.recepcao
        senha: demo-recepcao-2026
      - perfil: {pt: Profissional, en: Practitioner, es: Profesional}
        usuario: demo.profissional
        senha: demo-profissional-2026
    # Access roles: each login sees and does only what its role allows.
    perfis:
      - nome: {pt: Recepção, en: Front desk, es: Recepción}
        tela: imagens/kaladrius/perfil-recepcao.png
        resumo:
          pt: Atende, agenda e recebe. Vê a agenda de todos os profissionais.
          en: Greets, schedules and takes payments. Sees every practitioner's schedule.
          es: Atiende, agenda y cobra. Ve la agenda de todos los profesionales.
        pode:
          - {pt: "Agenda de todos os profissionais: marcar, remarcar, desmarcar e registrar presença", en: "Every practitioner's schedule: book, move, cancel and mark attendance", es: "Agenda de todos los profesionales: agendar, cambiar, cancelar y marcar asistencia"}
          - {pt: Cadastrar e alterar pacientes, en: Add and edit patients, es: Registrar y modificar pacientes}
          - {pt: Rechamadas e aniversariantes, en: Recalls and birthdays, es: Recordatorios y cumpleaños}
          - {pt: Criar e alterar orçamentos, en: Create and edit estimates, es: Crear y modificar presupuestos}
          - {pt: "Receber pagamentos, emitir recibos e ver devedores", en: "Take payments, issue receipts and see debtors", es: "Cobrar, emitir recibos y ver deudores"}
        nao_pode:
          - {pt: Abrir o prontuário, en: Open the medical record, es: Abrir la historia clínica}
          - {pt: "Cancelar lançamentos, estornar pagamentos ou dar descontos", en: "Cancel entries, reverse payments or give discounts", es: "Anular asientos, revertir pagos o dar descuentos"}
          - {pt: "Contas a pagar, fluxo de caixa e relatórios", en: "Payables, cash flow and reports", es: "Cuentas por pagar, flujo de caja e informes"}
          - {pt: "Equipe, configurações da clínica e auditoria", en: "Team, clinic settings and audit log", es: "Equipo, configuración de la clínica y auditoría"}
      - nome: {pt: Profissional, en: Practitioner, es: Profesional}
        tela: imagens/kaladrius/perfil-profissional.png
        resumo:
          pt: Dentista, médico ou outro profissional de saúde. Vê só a própria agenda e é quem usa o prontuário.
          en: A dentist, physician or other health professional. Sees only their own schedule and is the one who uses the medical record.
          es: Odontólogo, médico u otro profesional de la salud. Ve solo su propia agenda y es quien usa la historia clínica.
        pode:
          - {pt: "A própria agenda: marcar, remarcar e registrar presença", en: "Their own schedule: book, move and mark attendance", es: "Su propia agenda: agendar, cambiar y marcar asistencia"}
          - {pt: "Prontuário: anamnese, finalizar, adendos, atestados, receitas, pedidos de exames e anexos", en: "Medical record: anamnesis, finalizing, addenda, certificates, prescriptions, exam requests and attachments", es: "Historia clínica: anamnesis, finalizar, adendas, certificados, recetas, solicitudes de exámenes y adjuntos"}
          - {pt: Cadastrar e alterar pacientes, en: Add and edit patients, es: Registrar y modificar pacientes}
          - {pt: "Rechamadas, aniversariantes e orçamentos", en: "Recalls, birthdays and estimates", es: "Recordatorios, cumpleaños y presupuestos"}
        nao_pode:
          - {pt: A agenda dos outros profissionais, en: Other practitioners' schedules, es: La agenda de otros profesionales}
          - {pt: "Financeiro: recebimentos, contas e relatórios", en: "Finance: payments, accounts and reports", es: "Finanzas: cobros, cuentas e informes"}
          - {pt: "Equipe, configurações da clínica e auditoria", en: "Team, clinic settings and audit log", es: "Equipo, configuración de la clínica y auditoría"}
      - nome: {pt: Administrador da clínica, en: Clinic administrator, es: Administrador de la clínica}
        tela: imagens/kaladrius/perfil-admin.png
        resumo:
          pt: O dono ou gerente da clínica. Faz tudo e cuida da equipe.
          en: The clinic's owner or manager. Does everything and manages the team.
          es: El dueño o gerente de la clínica. Hace todo y administra el equipo.
        pode:
          - {pt: "Tudo o que a recepção faz, na agenda de todos", en: "Everything the front desk does, on everyone's schedule", es: "Todo lo que hace la recepción, en la agenda de todos"}
          - {pt: "Equipe: criar logins, escolher o perfil, trocar senhas e desativar acessos", en: "Team: create logins, choose the role, reset passwords and disable access", es: "Equipo: crear usuarios, elegir el perfil, cambiar contraseñas y desactivar accesos"}
          - {pt: "Financeiro completo: caixa, contas a pagar, fluxo de caixa, relatórios, comissões e extrato", en: "Full finance: cash desk, payables, cash flow, reports, commissions and bank statements", es: "Finanzas completas: caja, cuentas por pagar, flujo de caja, informes, comisiones y extracto"}
          - {pt: "Profissionais, tabelas (tipos de atendimento, procedimentos) e configurações da clínica", en: "Practitioners, price and appointment-type lists, and clinic settings", es: "Profesionales, tablas (tipos de consulta, procedimientos) y configuración de la clínica"}
          - {pt: "Auditoria e pacientes arquivados", en: "Audit log and archived patients", es: "Auditoría y pacientes archivados"}
        nao_pode:
          - {pt: "Abrir o prontuário, a menos que também esteja cadastrado como profissional", en: "Open the medical record, unless also registered as a practitioner", es: "Abrir la historia clínica, salvo que también esté registrado como profesional"}
    perfis_nota:
      pt: O que um perfil não pode usar nem aparece na tela, e o servidor confere cada ação. Ninguém muda o próprio perfil, e a clínica sempre tem um administrador ativo.
      en: What a role cannot use does not even show on screen, and the server checks every action. Nobody changes their own role, and the clinic always has an active administrator.
      es: Lo que un perfil no puede usar ni siquiera aparece en pantalla, y el servidor verifica cada acción. Nadie cambia su propio perfil, y la clínica siempre tiene un administrador activo.

# The "About" page: the owner and his YouTube channel.
sobre:
  foto: imagens/youtube/canal.jpg
  texto:
    pt:
      - Sou o Miguel. Estou na frente de um computador desde a década de 80, trabalho há mais de 20 anos com tecnologia e hoje atuo como DevOps.
      - Aqui ficam os sistemas de código aberto que eu desenvolvo, como o Kaladrius, e o meu canal no YouTube, onde ensino Linux e DevOps.
    es:
      - Soy Miguel. Estoy frente a una computadora desde los años 80, trabajo hace más de 20 años en tecnología y hoy me dedico a DevOps.
      - Aquí están los sistemas de código abierto que desarrollo, como Kaladrius, y mi canal de YouTube, donde enseño Linux y DevOps.
    en:
      - I'm Miguel. I've been in front of a computer since the 1980s, I've worked in technology for more than 20 years, and today I work as a DevOps engineer.
      - Here are the open-source systems I build, such as Kaladrius, and my YouTube channel, where I teach Linux and DevOps.
  linkedin: https://www.linkedin.com/in/miguelfacchini
  canal:
    nome: 404 DevOps Not Found
    url: https://www.youtube.com/@404devopsnotfound
    descricao:
      pt:
        - Tutoriais de Linux e DevOps para ajudar na carreira de quem trabalha com DevOps, desenvolvimento, SRE e áreas próximas.
        - Criação de ambientes e instalações do zero, com o código disponível, tutoriais e documentação, em servidores próprios (on-premises) e na nuvem. Os repositórios ficam no Git sempre que precisar.
      es:
        - Tutoriales de Linux y DevOps para ayudar en la carrera de quienes trabajan en DevOps, desarrollo, SRE y áreas cercanas.
        - Creación de entornos e instalaciones desde cero, con el código disponible, tutoriales y documentación, en servidores propios (on-premises) y en la nube. Los repositorios quedan en Git cuando hace falta. Videos en portugués.
      en:
        - Linux and DevOps tutorials to help the careers of people working in DevOps, development, SRE and nearby fields.
        - Building environments and installing from scratch, with the code available, tutorials and documentation, on your own servers (on-premises) and in the cloud. The repositories go on Git whenever needed. Videos in Portuguese.
    topicos: [Docker, Kubernetes, CI/CD com Jenkins, Nexus, SonarQube, Ansible, Prometheus e Grafana, Terraform, YAML, Virtualização, Shell Script, On-premises, Cloud]
