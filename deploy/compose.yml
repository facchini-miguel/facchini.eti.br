# www.facchini.eti.br on the VPS: a raw Compose in Dokploy (project "Site"), created and updated
# by deploy/setup.sh. Two services share the volume "site":
# - builder keeps a copy of the public repository (fetched every 2 minutes), builds the site with
#   construir.py on every new commit and every 10 minutes (so each system shows its newest GitHub
#   release), and switches to the new build at once when anything changed;
# - web (nginx) serves the current build behind Dokploy's Traefik.
# facchini.eti.br (without www) answers with a permanent redirect to www.facchini.eti.br.
services:
  builder:
    image: python:3.15.0-alpine3.24
    restart: unless-stopped
    command: ["sh", "/build.sh"]
    environment:
      REPOSITORY: https://github.com/facchini-miguel/facchini.eti.br.git
      BRANCH: main
      FETCH_EVERY: "120"
      BUILD_EVERY: "600"
    configs:
      - source: build
        target: /build.sh
    volumes:
      - site:/srv/site
      - work:/work
    networks: [default]
    labels:
      - site.config=${CONFIG_HASH:-}

  web:
    image: nginx:1.31.7-alpine3.24
    restart: unless-stopped
    configs:
      - source: nginx
        target: /etc/nginx/conf.d/default.conf
    volumes:
      - site:/srv/site:ro
    networks: [dokploy-network]
    labels:
      - site.config=${CONFIG_HASH:-}
      - traefik.enable=true
      - traefik.docker.network=dokploy-network
      - traefik.http.services.site.loadbalancer.server.port=80
      - traefik.http.middlewares.site-compress.compress=true
      - traefik.http.middlewares.site-no-server.headers.customResponseHeaders.Server=
      - traefik.http.middlewares.site-https.redirectscheme.scheme=https
      - traefik.http.middlewares.site-https.redirectscheme.permanent=true
      - traefik.http.middlewares.site-to-www.redirectregex.regex=^https?://facchini\.eti\.br/(.*)
      - traefik.http.middlewares.site-to-www.redirectregex.replacement=https://www.facchini.eti.br/$${1}
      - traefik.http.middlewares.site-to-www.redirectregex.permanent=true
      - traefik.http.routers.site.rule=Host(`www.facchini.eti.br`)
      - traefik.http.routers.site.entrypoints=websecure
      - traefik.http.routers.site.tls.certresolver=letsencrypt
      - traefik.http.routers.site.service=site
      - traefik.http.routers.site.middlewares=site-compress,site-no-server
      - traefik.http.routers.site-apex.rule=Host(`facchini.eti.br`)
      - traefik.http.routers.site-apex.entrypoints=websecure
      - traefik.http.routers.site-apex.tls.certresolver=letsencrypt
      - traefik.http.routers.site-apex.service=site
      - traefik.http.routers.site-apex.middlewares=site-to-www
      - traefik.http.routers.site-http.rule=Host(`www.facchini.eti.br`) || Host(`facchini.eti.br`)
      - traefik.http.routers.site-http.entrypoints=web
      - traefik.http.routers.site-http.service=site
      - traefik.http.routers.site-http.middlewares=site-https

networks:
  dokploy-network:
    external: true

volumes:
  site:
  work:

configs:
  build:
    content: |
      # Keeps /srv/site/current pointing at the newest build of the site. A failed build is
      # logged and the site keeps the previous one; the next round tries again.
      set -u
      log() { echo "$$(date -u '+%F %T') $$*"; }
      until apk add --no-cache -q git; do log "apk add git failed, again in 30 s"; sleep 30; done
      [ -x /work/venv/bin/python ] || python3 -m venv /work/venv
      mkdir -p /srv/site/builds
      built_commit=""; built_at=0; requirements=""
      while true; do
        if [ -d /work/repo/.git ]; then
          git -C /work/repo fetch -q --depth 1 origin "$$BRANCH" \
            && git -C /work/repo reset -q --hard FETCH_HEAD || log "git fetch failed"
        else
          rm -rf /work/repo
          git clone -q --depth 1 --branch "$$BRANCH" "$$REPOSITORY" /work/repo || log "git clone failed"
        fi
        commit=$$(git -C /work/repo rev-parse --short HEAD 2>/dev/null || true)
        now=$$(date +%s)
        if [ -n "$$commit" ] && { [ "$$commit" != "$$built_commit" ] || [ $$((now - built_at)) -ge "$$BUILD_EVERY" ]; }; then
          wanted=$$(sha256sum /work/repo/requirements.txt | cut -c1-64)
          if [ "$$wanted" != "$$requirements" ]; then
            /work/venv/bin/pip install -q --disable-pip-version-check -r /work/repo/requirements.txt \
              && requirements=$$wanted || log "pip install failed"
          fi
          if (cd /work/repo && /work/venv/bin/python construir.py >/dev/null); then
            built_commit=$$commit; built_at=$$now
            # Published only when something changed (most rounds rebuild the same site).
            fingerprint=$$(cd /work/repo/_site && find . -type f -exec sha256sum {} + | sort | sha256sum | cut -c1-16)
            current=$$(readlink /srv/site/current 2>/dev/null || true)
            if [ "$$current" != "builds/$$fingerprint" ]; then
              rm -rf "/srv/site/builds/$$fingerprint"
              cp -a /work/repo/_site "/srv/site/builds/$$fingerprint"
              # A new symbolic link renamed over the old one (rename(2), which "mv" would not
              # do onto a link to a folder): nginx sees the old build or the new one, never half
              # of each.
              ln -sfn "builds/$$fingerprint" /srv/site/next \
                && python3 -c 'import os; os.replace("/srv/site/next", "/srv/site/current")'
              log "published $$commit as builds/$$fingerprint"
              # Keeps the new build and the one it replaced.
              for old in /srv/site/builds/*; do
                case "$$old" in
                  */"$$fingerprint"|*/"$${current#builds/}") ;;
                  *) rm -rf "$$old" ;;
                esac
              done
            fi
          else
            log "construir.py failed on $$commit; the site keeps the previous build"
          fi
        fi
        sleep "$$FETCH_EVERY"
      done
  nginx:
    content: |
      server {
        listen 80 default_server;
        server_name _;
        root /srv/site/current;
        index index.html;
        server_tokens off;
        # "/sobre" -> "/sobre/" with a relative address, right behind Traefik's HTTPS.
        absolute_redirect off;
        charset utf-8;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header Strict-Transport-Security "max-age=31536000" always;
        location ~ /\. { return 404; }
        location / {
          try_files $$uri $$uri/ =404;
          add_header X-Content-Type-Options nosniff always;
          add_header Referrer-Policy strict-origin-when-cross-origin always;
          add_header Strict-Transport-Security "max-age=31536000" always;
          add_header Cache-Control "public, max-age=600" always;
        }
        location ~ \.html$$ {
          add_header X-Content-Type-Options nosniff always;
          add_header Referrer-Policy strict-origin-when-cross-origin always;
          add_header Strict-Transport-Security "max-age=31536000" always;
          add_header Cache-Control "no-cache" always;
        }
      }
