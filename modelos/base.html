<!doctype html>
<html lang="{{ t.lang }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block titulo %}{{ site.titulo }}{% endblock %}</title>
  <meta name="description" content="{% block descricao %}{{ t.chamada }}{% endblock %}">
  <link rel="icon" href="{{ raiz }}imagens/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="{{ raiz }}css/site.css">
</head>
<body>
  <header class="topo">
    <div class="largura topo-conteudo">
      <a class="marca" href="{{ raiz }}{% if idioma == 'en' %}en/{% endif %}">{{ site.titulo }}</a>
      <nav class="menu">
        <a href="{{ raiz }}{% if idioma == 'en' %}en/{% endif %}#sistemas">{{ t.sistemas }}</a>
        <a href="{{ raiz }}{% if idioma == 'en' %}en/{% endif %}#apoiar">{{ t.apoiar }}</a>
        <a href="{{ site.github }}" target="_blank" rel="noopener">GitHub</a>
        <a class="idioma" href="{{ outro_idioma }}" lang="{{ 'pt-BR' if idioma == 'en' else 'en' }}">{{ t.outro_idioma }}</a>
      </nav>
    </div>
  </header>
  <main>
    {% block conteudo %}{% endblock %}
    {% include "_apoio.html" %}
  </main>
  <footer class="rodape">
    <div class="largura">
      <span>© {{ site.titulo }} · {{ t.rodape }}</span>
      <a href="{{ site.github }}" target="_blank" rel="noopener">github.com/facchini-miguel</a>
    </div>
  </footer>
</body>
</html>
