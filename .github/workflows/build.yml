# Checks that the site builds, on every push and pull request. Publishing is not done here: the
# VPS (deploy/compose.yml) fetches main every 2 minutes and rebuilds the site by itself.
name: Build

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.13"
      - run: pip install -r requirements.txt && python construir.py
      - run: test -f _site/index.html && test -f _site/sitemap.xml
